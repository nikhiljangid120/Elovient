name: Bug Tracker Lite CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Automated Unit/Integration Tests & Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Test Pipeline
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Automated Test Suite (Jest + Supertest)
        working-directory: ./backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_1234567890

      # Frontend Build Pipeline
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend React SPA (Vite)
        working-directory: ./frontend
        run: npm run build

      # Docker Verification
      - name: Build Backend Docker Image
        run: docker build -t bug-tracker-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: docker build -t bug-tracker-frontend:latest ./frontend
